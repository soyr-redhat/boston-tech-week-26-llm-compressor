# GPTQ INT4 Quantization Recipe
# Reduces weights to 4-bit integers
# Expected compression: ~75% size reduction

quant_stage:
    quant_modifiers:
        GPTQModifier:
            sequential_update: false
            ignore: ["lm_head"]
            config_groups:
                group_0:
                    weights:
                        num_bits: 4
                        type: "int"
                        symmetric: true
                        strategy: "channel"
                    targets: ["Linear"]
