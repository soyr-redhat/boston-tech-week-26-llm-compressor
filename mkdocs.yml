site_name: Boston Tech Week 2026 - LLM Quantization Workshop
site_description: Hands-on workshop on LLM quantization and benchmarking with vLLM
site_url: https://soyr-redhat.github.io/boston-tech-week-26-llm-compressor/
repo_url: https://github.com/soyr-redhat/boston-tech-week-26-llm-compressor
edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/redhat.svg
  favicon: assets/redhat.svg
  features:
    - navigation.sections
    - navigation.instant
    - navigation.tracking
    - content.code.copy
    - content.action.edit
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - footnotes
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets

nav:
  - Home: index.md
  - Local Setup: local-setup.md
  - Technical:
      - Cluster Status: cluster-status.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/soyr-redhat/boston-tech-week-26-llm-compressor

extra_css:
  - stylesheets/custom.css
