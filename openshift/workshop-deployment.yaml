apiVersion: v1
kind: Namespace
metadata:
  name: workshop
  labels:
    workshop: boston-tech-week-2026
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-original
  namespace: workshop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-original
  template:
    metadata:
      labels:
        app: vllm-original
    spec:
      containers:
      - name: vllm
        image: vllm/vllm-openai:latest
        command: ["vllm", "serve", "Qwen/Qwen3.5-9B", "--port", "8080", "--host", "0.0.0.0", "--max-model-len", "8192", "--tensor-parallel-size", "2"]
        env:
        - name: HOME
          value: "/tmp"
        - name: HF_HOME
          value: "/tmp/huggingface"
        ports:
        - containerPort: 8080
        resources:
          requests:
            nvidia.com/gpu: "2"
            cpu: "4"
            memory: "8Gi"
          limits:
            nvidia.com/gpu: "2"
            cpu: "8"
            memory: "16Gi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-quantized
  namespace: workshop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-quantized
  template:
    metadata:
      labels:
        app: vllm-quantized
    spec:
      containers:
      - name: vllm
        image: vllm/vllm-openai:latest
        command: ["vllm", "serve", "RedHatAI/Qwen3.5-9B-quantized.w4a16", "--port", "8081", "--host", "0.0.0.0", "--max-model-len", "8192", "--tensor-parallel-size", "2"]
        env:
        - name: HOME
          value: "/tmp"
        - name: HF_HOME
          value: "/tmp/huggingface"
        ports:
        - containerPort: 8081
        resources:
          requests:
            nvidia.com/gpu: "2"
            cpu: "4"
            memory: "8Gi"
          limits:
            nvidia.com/gpu: "2"
            cpu: "8"
            memory: "16Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-original
  namespace: workshop
spec:
  selector:
    app: vllm-original
  ports:
  - port: 8080
    targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-quantized
  namespace: workshop
spec:
  selector:
    app: vllm-quantized
  ports:
  - port: 8081
    targetPort: 8081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: comparison-ui
  namespace: workshop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: comparison-ui
  template:
    metadata:
      labels:
        app: comparison-ui
    spec:
      containers:
      - name: gradio
        image: python:3.12-slim
        workingDir: /app
        command: ["/bin/sh", "-c"]
        args:
        - |
          pip install --user --no-cache-dir gradio requests && \
          python -u comparison_ui.py
        env:
        - name: HOME
          value: "/tmp"
        - name: PYTHONUNBUFFERED
          value: "1"
        ports:
        - containerPort: 7860
        volumeMounts:
        - name: app-code
          mountPath: /app
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "1"
            memory: "2Gi"
      volumes:
      - name: app-code
        configMap:
          name: comparison-ui-code
---
apiVersion: v1
kind: Service
metadata:
  name: comparison-ui
  namespace: workshop
spec:
  selector:
    app: comparison-ui
  ports:
  - port: 7860
    targetPort: 7860
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: comparison-ui
  namespace: workshop
spec:
  host: comparison-ui.apps.ocp.ntdrq.sandbox503.opentlc.com
  to:
    kind: Service
    name: comparison-ui
  port:
    targetPort: 7860
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
