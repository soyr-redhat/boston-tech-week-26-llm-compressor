---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jupyter
  namespace: workshop
  labels:
    app: jupyter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jupyter
  template:
    metadata:
      labels:
        app: jupyter
    spec:
      containers:
      - name: jupyter
        image: quay.io/jupyter/scipy-notebook:latest
        ports:
        - containerPort: 8888
          name: http
        env:
        - name: JUPYTER_ENABLE_LAB
          value: "yes"
        - name: GRANT_SUDO
          value: "yes"
        volumeMounts:
        - name: notebooks
          mountPath: /home/jovyan/work
        - name: workshop-notebook
          mountPath: /home/jovyan/workshop_notebook.ipynb
          subPath: workshop_notebook.ipynb
        resources:
          requests:
            memory: "2Gi"
            cpu: "1"
          limits:
            memory: "4Gi"
            cpu: "2"
      volumes:
      - name: notebooks
        emptyDir: {}
      - name: workshop-notebook
        configMap:
          name: workshop-notebook

---
apiVersion: v1
kind: Service
metadata:
  name: jupyter
  namespace: workshop
spec:
  selector:
    app: jupyter
  ports:
  - port: 8888
    targetPort: 8888
    name: http

---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: jupyter
  namespace: workshop
spec:
  to:
    kind: Service
    name: jupyter
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
