apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-original
  labels:
    app: vllm-original
    workshop: boston-tech-week-2026
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-original
  template:
    metadata:
      labels:
        app: vllm-original
    spec:
      containers:
      - name: vllm
        image: vllm/vllm-openai:latest
        command:
        - vllm
        - serve
        - Qwen/Qwen2.5-0.5B
        - --port
        - "8080"
        - --host
        - "0.0.0.0"
        env:
        - name: HOME
          value: "/tmp"
        - name: HF_HOME
          value: "/tmp/huggingface"
        ports:
        - containerPort: 8080
          name: http
        resources:
          requests:
            nvidia.com/gpu: "1"
            cpu: "4"
            memory: "8Gi"
          limits:
            nvidia.com/gpu: "1"
            cpu: "8"
            memory: "16Gi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-original
spec:
  selector:
    app: vllm-original
  ports:
  - name: http
    port: 8080
    targetPort: 8080
  type: ClusterIP
