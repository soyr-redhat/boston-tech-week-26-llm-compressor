apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-quantized
  labels:
    app: vllm-quantized
    workshop: boston-tech-week-2026
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-quantized
  template:
    metadata:
      labels:
        app: vllm-quantized
    spec:
      containers:
      - name: vllm
        image: vllm/vllm-openai:latest
        command:
        - vllm
        - serve
        - neuralmagic/Qwen2.5-0.5B-Instruct-FP8
        - --port
        - "8081"
        - --host
        - "0.0.0.0"
        - --quantization
        - fp8
        ports:
        - containerPort: 8081
          name: http
        resources:
          requests:
            nvidia.com/gpu: "1"
            cpu: "4"
            memory: "8Gi"
          limits:
            nvidia.com/gpu: "1"
            cpu: "8"
            memory: "16Gi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8081
          initialDelaySeconds: 60
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8081
          initialDelaySeconds: 30
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-quantized
spec:
  selector:
    app: vllm-quantized
  ports:
  - name: http
    port: 8081
    targetPort: 8081
  type: ClusterIP
