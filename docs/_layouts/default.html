<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}"/>
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
    <style>
      .nav-bar {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        padding: 1rem 0;
        margin-bottom: 2rem;
      }
      .nav-container {
        max-width: 64rem;
        margin: 0 auto;
        padding: 0 1rem;
        display: flex;
        gap: 2rem;
        align-items: center;
        flex-wrap: wrap;
      }
      .nav-link {
        color: white;
        text-decoration: none;
        padding: 0.5rem 1rem;
        border-radius: 4px;
        transition: background 0.2s;
        font-weight: 500;
      }
      .nav-link:hover {
        background: rgba(255, 255, 255, 0.2);
      }
      .nav-link.active {
        background: rgba(255, 255, 255, 0.3);
      }
      .demo-link {
        background: #4CAF50;
        color: white !important;
        padding: 0.5rem 1.5rem;
        border-radius: 4px;
        text-decoration: none;
        font-weight: bold;
        transition: background 0.2s;
      }
      .demo-link:hover {
        background: #45a049;
      }
      .page-header {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      }
      code {
        background: #2f383e;
        color: #d3c6aa;
        padding: 0.2rem 0.4rem;
        border-radius: 3px;
      }
      pre {
        background: #2f383e !important;
        border: 1px solid #4a555b;
      }
      pre code {
        background: transparent;
      }
    </style>
  </head>
  <body>
    <header class="page-header" role="banner">
      <h1 class="project-name">{{ site.title }}</h1>
      <h2 class="project-tagline">{{ site.description }}</h2>
      <a href="https://comparison-ui.apps.ocp.ntdrq.sandbox503.opentlc.com" class="demo-link" target="_blank">Live Demo</a>
    </header>

    <nav class="nav-bar">
      <div class="nav-container">
        <a href="{{ '/' | relative_url }}" class="nav-link {% if page.url == '/' %}active{% endif %}">Home</a>
        <a href="{{ '/quick-start' | relative_url }}" class="nav-link {% if page.url contains 'quick-start' %}active{% endif %}">Quick Start</a>
        <a href="{{ '/workshop-guide' | relative_url }}" class="nav-link {% if page.url contains 'workshop-guide' %}active{% endif %}">Workshop Guide</a>
        <a href="{{ '/instructor-guide' | relative_url }}" class="nav-link {% if page.url contains 'instructor-guide' %}active{% endif %}">Instructor Guide</a>
        <a href="{{ '/cluster-status' | relative_url }}" class="nav-link {% if page.url contains 'cluster-status' %}active{% endif %}">Cluster Status</a>
      </div>
    </nav>

    <main id="content" class="main-content" role="main">
      {{ content }}

      <footer class="site-footer">
        <span class="site-footer-owner">Boston Tech Week 2026 - LLM Quantization Workshop</span>
        <span class="site-footer-credits">Powered by vLLM, guidellm, and OpenShift</span>
      </footer>
    </main>
  </body>
</html>
